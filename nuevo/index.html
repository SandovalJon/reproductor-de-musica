<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Nuevo Reproductor de Música</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
    </style>
    <style>
      :root{
        --bg:#faf6f2; --bg2:#f3ece5; --surface:#ffffff; --surface2:#f4ede7;
        --ink:#201914; --muted:#7d7066; --line:rgba(32,25,20,.10);
        --acc:#f0512f; --acc2:#ff9e4f; --acc-ink:#ffffff;
        --danger:#d93a2b; --ok:#1f9d63;
        --shadow:0 18px 40px rgba(60,30,10,.16);
        --radius:18px;
        color-scheme:light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#100d10; --bg2:#171219; --surface:#1d171d; --surface2:#282029;
          --ink:#f7f0ea; --muted:#ab9d97; --line:rgba(247,240,234,.10);
          --acc:#ff6a3d; --acc2:#ffb35c; --acc-ink:#ffffff;
          --danger:#ff6a5c; --ok:#3ecf8e;
          --shadow:0 18px 44px rgba(0,0,0,.5);
          color-scheme:dark;
        }
      }
      *{ box-sizing:border-box; }
      html,body{ height:100%; }
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing:antialiased; overflow:hidden;
      }
      button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
      input,select{ font:inherit; color:inherit; }
      svg{ display:block; }
      .ic{ width:22px; height:22px; fill:currentColor; flex:none; }
      .ic.sm{ width:18px; height:18px; }
      .ic.lg{ width:30px; height:30px; }

      /* ---------- Layout ---------- */
      .app{ display:flex; flex-direction:column; height:100dvh; }
      .main{ flex:1; overflow-y:auto; padding:0 16px 132px; scroll-padding-bottom:140px; }
      .wrap{ max-width:1060px; margin:0 auto; }

      header.top{
        padding:calc(14px + env(safe-area-inset-top)) 16px 6px;
      }
      .top-in{ max-width:1060px; margin:0 auto; display:flex; align-items:center; gap:10px; }
      .top h1{ font-size:26px; font-weight:800; letter-spacing:-.02em; margin:0; flex:1; line-height:1.1; }
      .top h1 span{ display:block; font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; margin-top:2px; }
      .btn{
        display:inline-flex; align-items:center; gap:8px; border-radius:999px;
        padding:9px 16px; font-weight:600; min-height:44px; justify-content:center;
      }
      .btn-acc{ background:linear-gradient(135deg, var(--acc), var(--acc2)); color:var(--acc-ink); box-shadow:0 8px 20px rgba(240,81,47,.32); }
      .btn-ghost{ background:var(--surface2); color:var(--ink); }
      .btn-danger{ background:var(--danger); color:#fff; }
      .icon-btn{
        width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
        background:var(--surface2); color:var(--ink); flex:none;
      }
      .icon-btn.plain{ background:transparent; }
      .icon-btn.on{ background:var(--acc); color:#fff; }

      /* Tabs */
      .tabs{ display:flex; gap:8px; padding:10px 16px 4px; max-width:1060px; margin:0 auto; width:100%; overflow-x:auto; scrollbar-width:none; }
      .tabs::-webkit-scrollbar{ display:none; }
      .tab{
        padding:9px 18px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
        font-weight:600; white-space:nowrap; min-height:44px;
      }
      .tab.on{ background:var(--ink); color:var(--bg); border-color:transparent; }
      @media (max-width:520px){
        .tabs{ gap:6px; padding-left:12px; padding-right:12px; }
        .tab{ padding:8px 12px; font-size:14px; }
        .search{ flex:1 1 100%; }
        .shuffle-all{ margin-left:0; }
      }

      /* Toolbar */
      .toolbar{ display:flex; gap:8px; align-items:center; padding:10px 0 4px; flex-wrap:wrap; }
      .search{
        flex:1; min-width:170px; display:flex; align-items:center; gap:8px;
        background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 14px; min-height:44px;
      }
      .search input{ flex:1; border:0; background:transparent; outline:none; min-height:40px; font-size:15px; }
      .search .ic{ color:var(--muted); }
      select.sort{
        background:var(--surface); border:1px solid var(--line); border-radius:999px;
        padding:0 12px; min-height:44px; font-weight:500;
      }
      .seg{ display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; }
      .seg button{ width:40px; height:38px; border-radius:999px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
      .seg button.on{ background:var(--surface2); color:var(--ink); }
      .shuffle-all{ margin-left:auto; }

      /* Song rows */
      .rows{ display:flex; flex-direction:column; }
      .row{
        display:flex; align-items:center; gap:12px; padding:9px 8px; border-radius:14px; cursor:pointer;
        -webkit-tap-highlight-color:transparent;
      }
      .row:hover{ background:var(--surface2); }
      .row.playing{ background:var(--surface2); }
      .row.disliked{ opacity:.42; }
      .row .meta{ flex:1; min-width:0; }
      .row .t{ font-weight:600; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .row .a{ color:var(--muted); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .row .dur{ color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
      .row .rate{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--muted); }
      .row .rate.like{ color:var(--acc); }
      .row .rate.dislike{ color:var(--danger); }
      .row .more{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--muted); }
      .cover{
        width:52px; height:52px; border-radius:12px; overflow:hidden; flex:none; position:relative;
        display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.92);
        font-weight:800; font-size:21px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
      }
      .cover img{ width:100%; height:100%; object-fit:cover; }
      .cover .eq{ position:absolute; inset:0; display:none; align-items:flex-end; justify-content:center; gap:3px; padding-bottom:13px; background:rgba(10,5,5,.35); }
      .row.playing .cover .eq, .card.playing .cover .eq{ display:flex; }
      .eq i{ width:4px; background:#fff; border-radius:2px; height:6px; }
      .playing .eq i{ animation:eqb 0.9s ease-in-out infinite; }
      .eq i:nth-child(2){ animation-delay:.25s; } .eq i:nth-child(3){ animation-delay:.5s; }
      @keyframes eqb{ 0%,100%{ height:5px; } 50%{ height:16px; } }

      /* Grid cards */
      .grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:16px 14px; padding-top:6px; }
      @media (min-width:560px){ .grid{ grid-template-columns:repeat(3, 1fr); } }
      @media (min-width:860px){ .grid{ grid-template-columns:repeat(4, 1fr); } }
      @media (min-width:1100px){ .grid{ grid-template-columns:repeat(5, 1fr); } }
      .card{ cursor:pointer; min-width:0; }
      .card .cover{ width:100%; height:auto; aspect-ratio:1; border-radius:var(--radius); font-size:44px; }
      .card .t{ font-weight:600; margin-top:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:15px; }
      .card .a{ color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .card.disliked{ opacity:.42; }

      /* Group lists (artists / albums / playlists) */
      .group-row{ display:flex; align-items:center; gap:14px; padding:12px 8px; border-radius:14px; cursor:pointer; }
      .group-row:hover{ background:var(--surface2); }
      .group-row .cover{ width:58px; height:58px; border-radius:14px; font-size:23px; }
      .group-row .meta{ flex:1; min-width:0; }
      .group-row .t{ font-weight:700; font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .group-row .a{ color:var(--muted); font-size:13.5px; }
      .group-row .chev{ color:var(--muted); }
      .back-row{ display:flex; align-items:center; gap:6px; padding:12px 0 2px; font-weight:700; font-size:17px; }
      .back-row button{ display:flex; align-items:center; gap:4px; padding:8px 10px 8px 2px; min-height:44px; font-weight:700; font-size:16px; }
      .detail-head{ display:flex; gap:16px; align-items:center; padding:10px 0 16px; }
      .detail-head .cover{ width:104px; height:104px; border-radius:20px; font-size:42px; }
      .detail-head h2{ margin:0 0 4px; font-size:23px; font-weight:800; letter-spacing:-.01em; }
      .detail-head p{ margin:0; color:var(--muted); font-size:14px; }
      .detail-actions{ display:flex; gap:8px; flex-wrap:wrap; padding-bottom:10px; }

      /* Empty states */
      .empty{
        text-align:center; padding:52px 26px 40px; max-width:460px; margin:26px auto 0;
        background:var(--surface); border:1px solid var(--line); border-radius:26px;
      }
      .empty .art{
        width:92px; height:92px; margin:0 auto 18px; border-radius:28px;
        background:linear-gradient(135deg, var(--acc), var(--acc2)); color:#fff;
        display:flex; align-items:center; justify-content:center; box-shadow:0 14px 30px rgba(240,81,47,.3);
      }
      .empty .art .ic{ width:44px; height:44px; }
      .empty h2{ margin:0 0 8px; font-size:22px; font-weight:800; }
      .empty p{ margin:0 0 20px; color:var(--muted); line-height:1.55; font-size:15px; }
      .empty .cta{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
      .empty .hint{ margin-top:16px; font-size:13px; color:var(--muted); }

      /* Mini player */
      .mini{
        position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:40;
        background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow);
        display:none; align-items:center; gap:10px; padding:8px 10px; cursor:pointer;
      }
      .mini.show{ display:flex; }
      .mini .cover{ width:48px; height:48px; border-radius:12px; font-size:19px; }
      .mini .meta{ flex:1; min-width:0; }
      .mini .t{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .mini .a{ color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .mini .prog{ position:absolute; left:14px; right:14px; bottom:4px; height:3px; border-radius:2px; background:var(--line); overflow:hidden; }
      .mini .prog i{ display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--acc), var(--acc2)); border-radius:2px; }
      .mini button{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
      .mini .play-b{ background:var(--ink); color:var(--bg); }
      @media (min-width:900px){ .mini{ left:50%; right:auto; transform:translateX(-50%); width:min(680px, calc(100% - 32px)); } }
</style>
    <style>
      /* ---------- Overlays ---------- */
      .overlay{
        position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
        transform:translateY(100%); transition:transform .38s cubic-bezier(.32,.72,.24,1);
        pointer-events:none;
      }
      .overlay.open{ transform:translateY(0); pointer-events:auto; }
      @media (prefers-reduced-motion: reduce){ .overlay{ transition:none; } }

      /* Now Playing */
      .np{ color:#fff; overflow:hidden; }
      .np-bg{ position:absolute; inset:0; z-index:0; transition:background 0.8s ease; }
      .np-bg::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.42) 62%, rgba(0,0,0,.66)); }
      .np-in{ position:relative; z-index:1; display:flex; flex-direction:column; height:100%; padding:calc(10px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; width:100%; overflow-y:auto; }
      .np-top{ display:flex; align-items:center; gap:8px; }
      .np-top .lbl{ flex:1; text-align:center; font-size:12.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
      .np-top button{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; }
      .np-cover-wrap{ display:flex; justify-content:center; padding:20px 0 8px; }
      .np-cover{
        width:min(74vw, 340px); aspect-ratio:1; border-radius:26px; overflow:hidden; position:relative;
        display:flex; align-items:center; justify-content:center; font-size:110px; font-weight:800; color:rgba(255,255,255,.94);
        box-shadow:0 30px 60px rgba(0,0,0,.45); transition:transform .5s ease;
      }
      .np-cover img{ width:100%; height:100%; object-fit:cover; }
      .np.playing .np-cover{ animation:breathe 3.6s ease-in-out infinite; }
      @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.025); } }
      @media (prefers-reduced-motion: reduce){ .np.playing .np-cover{ animation:none; } }
      .np-title{ text-align:center; margin-top:16px; }
      .np-title h2{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
      .np-title p{ margin:5px 0 0; font-size:16px; opacity:.82; }
      .np-rate{ display:flex; justify-content:center; gap:14px; margin-top:14px; }
      .np-rate button{
        display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:999px; min-height:44px;
        background:rgba(255,255,255,.14); color:#fff; font-weight:600; font-size:14px; backdrop-filter:blur(6px);
      }
      .np-rate button.like-on{ background:#fff; color:#e23c1e; }
      .np-rate button.dislike-on{ background:rgba(0,0,0,.45); color:#ff8a7a; box-shadow:inset 0 0 0 1.5px #ff8a7a; }
      .seek{ margin-top:20px; }
      .seek input[type=range], .vol input[type=range]{ width:100%; accent-color:#fff; height:32px; cursor:pointer; }
      .times{ display:flex; justify-content:space-between; font-size:12.5px; opacity:.85; font-variant-numeric:tabular-nums; margin-top:-4px; }
      .np-controls{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; }
      .np-controls button{ width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; position:relative; }
      .np-controls button.on{ color:#ffd9a8; }
      .np-controls button.on::after{ content:""; position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:#ffd9a8; }
      .np-controls .big{ width:74px; height:74px; background:#fff; color:#1c1210; box-shadow:0 14px 30px rgba(0,0,0,.35); }
      .np-controls .big .ic{ width:34px; height:34px; }
      .rep1{ position:absolute; top:8px; right:8px; font-size:10px; font-weight:800; background:#ffd9a8; color:#1c1210; border-radius:6px; padding:1px 4px; display:none; }
      .np-controls button.rep-one .rep1{ display:block; }
      .vol{ display:flex; align-items:center; gap:10px; margin-top:6px; }
      .vol .ic{ opacity:.85; }
      .np-actions{ display:flex; justify-content:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
      .np-actions button{
        display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:999px; min-height:44px;
        background:rgba(255,255,255,.13); color:#fff; font-weight:600; font-size:14px;
      }
      .np-actions button.on{ background:#fff; color:#1c1210; }
      .timer-box{ margin-top:16px; background:rgba(0,0,0,.28); border-radius:18px; padding:14px 16px; display:none; }
      .timer-box.show{ display:block; }
      .timer-box h3{ margin:0 0 10px; font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; }
      .timer-box h3 span{ margin-left:auto; font-weight:500; opacity:.85; font-size:13px; }
      .chips{ display:flex; gap:8px; flex-wrap:wrap; }
      .chips button{ padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; font-weight:600; min-height:40px; }
      .chips button.on{ background:#fff; color:#1c1210; }
      .queue-box{ margin-top:16px; background:rgba(0,0,0,.28); border-radius:18px; padding:8px 6px; display:none; }
      .queue-box.show{ display:block; }
      .queue-box h3{ margin:8px 12px 6px; font-size:14px; font-weight:700; }
      .q-row{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:12px; cursor:pointer; }
      .q-row:hover{ background:rgba(255,255,255,.08); }
      .q-row .cover{ width:40px; height:40px; border-radius:9px; font-size:15px; }
      .q-row .meta{ flex:1; min-width:0; }
      .q-row .t{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .q-row .a{ font-size:12px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .q-row .x{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:50%; opacity:.8; }
      .q-empty{ padding:10px 14px 14px; font-size:14px; opacity:.8; }

      /* Stage mode */
      .stage{ color:#fff; overflow:hidden; background:#0a0708; }
      .stage-bg{ position:absolute; inset:-20%; z-index:0; filter:blur(60px) saturate(1.3); opacity:.85; transition:background 1s ease; }
      .stage.playing .stage-bg{ animation:drift 16s ease-in-out infinite alternate; }
      @keyframes drift{ from{ transform:rotate(0deg) scale(1); } to{ transform:rotate(24deg) scale(1.25); } }
      @media (prefers-reduced-motion: reduce){ .stage.playing .stage-bg{ animation:none; } }
      .stage::after{ content:""; position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.55) 100%); }
      .stage-in{ position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
      .stage-cover{
        width:min(72vw, 46vh, 430px); aspect-ratio:1; border-radius:30px; overflow:hidden; position:relative;
        display:flex; align-items:center; justify-content:center; font-size:130px; font-weight:800; color:rgba(255,255,255,.94);
        box-shadow:0 40px 90px rgba(0,0,0,.6);
      }
      .stage-cover img{ width:100%; height:100%; object-fit:cover; }
      .stage.playing .stage-cover{ animation:breathe 3.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce){ .stage.playing .stage-cover{ animation:none; } }
      .stage h2{ margin:26px 0 4px; font-size:clamp(24px, 4.5vw, 38px); font-weight:800; max-width:820px; }
      .stage p{ margin:0; font-size:clamp(15px, 2.4vw, 20px); opacity:.85; }
      .stage-controls{ display:flex; align-items:center; gap:14px; margin-top:30px; }
      .stage-controls button{ width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; background:rgba(255,255,255,.12); }
      .stage-controls .big{ width:84px; height:84px; background:#fff; color:#1c1210; }
      .stage-controls .big .ic{ width:38px; height:38px; }
      .stage-close{ position:absolute; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:3; width:48px; height:48px; border-radius:50%; background:rgba(0,0,0,.35); color:#fff; display:flex; align-items:center; justify-content:center; }
      .stage-prog{ width:min(72vw, 430px); margin-top:26px; }
      .stage-prog .bar{ height:5px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden; }
      .stage-prog .bar i{ display:block; height:100%; width:0%; background:#fff; border-radius:3px; }
      .stage-prog .times{ margin-top:7px; }

      /* Sheets & modals */
      .scrim{ position:fixed; inset:0; z-index:70; background:rgba(10,5,5,.5); opacity:0; pointer-events:none; transition:opacity .25s; }
      .scrim.show{ opacity:1; pointer-events:auto; }
      .sheet{
        position:fixed; left:0; right:0; bottom:0; z-index:71; background:var(--surface); color:var(--ink);
        border-radius:26px 26px 0 0; padding:10px 14px calc(16px + env(safe-area-inset-bottom));
        transform:translateY(105%); transition:transform .3s cubic-bezier(.32,.72,.24,1); max-height:82dvh; overflow-y:auto;
        box-shadow:var(--shadow);
      }
      .sheet.show{ transform:translateY(0); }
      @media (min-width:700px){ .sheet{ left:50%; right:auto; width:440px; margin-left:-220px; border-radius:26px; bottom:18px; } }
      .sheet .grab{ width:42px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 10px; }
      .sheet h3{ margin:2px 6px 4px; font-size:17px; font-weight:800; }
      .sheet .sub{ margin:0 6px 10px; color:var(--muted); font-size:13.5px; }
      .sheet-item{
        display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:12px 8px;
        border-radius:14px; font-weight:600; font-size:15.5px; min-height:52px;
      }
      .sheet-item:hover{ background:var(--surface2); }
      .sheet-item .ic{ color:var(--muted); }
      .sheet-item.danger{ color:var(--danger); } .sheet-item.danger .ic{ color:var(--danger); }
      .modal{
        position:fixed; inset:0; z-index:72; display:none; align-items:center; justify-content:center; padding:20px;
      }
      .modal.show{ display:flex; }

    /* ================= IndexedDB ================= */

        rq.onupgradeneeded = () => {
          const d = rq.result;
          if(!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks', { keyPath:'id' });
          if(!d.objectStoreNames.contains('files')) d.createObjectStore('files');
          if(!d.objectStoreNames.contains('covers')) d.createObjectStore('covers');
          if(!d.objectStoreNames.contains('playlists')) d.createObjectStore('playlists', { keyPath:'id' });
          if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        };
        rq.onsuccess = () => { db = rq.result; res(db); };
        rq.onerror = () => rej(rq.error);
      });

    function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
    function reqP(rq){ return new Promise((res, rej)=>{ rq.onsuccess = ()=>res(rq.result); rq.onerror = ()=>rej(rq.error); }); }

    /* ================= Metadatos: ID3v2 / ID3v1 ================= */
    function decodeText(bytes, enc){
      try{
        if(enc === 0) return new TextDecoder('iso-8859-1').decode(bytes).replace(/\0+$/,'');
        if(enc === 1) return new TextDecoder('utf-16').decode(bytes).replace(/\0+$/,'');
        if(enc === 2) return new TextDecoder('utf-16be').decode(bytes).replace(/\0+$/,'');
        return new TextDecoder('utf-8').decode(bytes).replace(/\0+$/,'');
      }catch(e){ return ''; }
    }
    function parseAPIC(data){
      if(!data || data.length < 4) return null;
      const enc = data[0];
      let i = 1, mime = '';
      while(i < data.length && data[i] !== 0){ mime += String.fromCharCode(data[i]); i++; }
      i++; // fin del mime
      i++; // tipo de imagen
      if(enc === 1 || enc === 2){
        while(i+1 < data.length && !(data[i]===0 && data[i+1]===0)) i += 2;
        i += 2;
      } else {
        while(i < data.length && data[i] !== 0) i++;
        i++;
      }
      if(i >= data.length) return null;
      const img = data.slice(i);
      if(img.length < 100) return null;
      return new Blob([img], { type: mime && mime.indexOf('image/')===0 ? mime : 'image/jpeg' });
    }
    async function readID3(blob){
      const out = { title:'', artist:'', album:'', cover:null };
      try{
        const head = await blob.slice(0, 10).arrayBuffer();
        const hv = new Uint8Array(head);
        if(hv[0]===0x49 && hv[1]===0x44 && hv[2]===0x33){ // "ID3"
          const major = hv[3];
          const tagSize = ((hv[6]&0x7f)<<21) | ((hv[7]&0x7f)<<14) | ((hv[8]&0x7f)<<7) | (hv[9]&0x7f);
          const buf = await blob.slice(0, 10 + tagSize).arrayBuffer();
          const v = new Uint8Array(buf);
          let pos = 10;
          while(pos + 10 <= v.length){
            const id = String.fromCharCode(v[pos], v[pos+1], v[pos+2], v[pos+3]);
            if(!/^[A-Z0-9]{4}$/.test(id)) break;
            let size;
            if(major === 4) size = ((v[pos+4]&0x7f)<<21) | ((v[pos+5]&0x7f)<<14) | ((v[pos+6]&0x7f)<<7) | (v[pos+7]&0x7f);
            else size = (v[pos+4]<<24) | (v[pos+5]<<16) | (v[pos+6]<<8) | v[pos+7];
            if(size <= 0 || pos + 10 + size > v.length + 10) break;
            const data = v.slice(pos+10, pos+10+size);
            if(id === 'TIT2') out.title = decodeText(data.slice(1), data[0]).trim();
            else if(id === 'TPE1') out.artist = decodeText(data.slice(1), data[0]).trim();
            else if(id === 'TALB') out.album = decodeText(data.slice(1), data[0]).trim();
            else if(id === 'APIC' && !out.cover) out.cover = parseAPIC(data);
            pos += 10 + size;
          }
        }
      }catch(e){ /* seguimos con ID3v1 / nombre de archivo */ }
      if(!out.title && !out.artist && blob.size > 128){
        try{
          const tail = new Uint8Array(await blob.slice(blob.size-128).arrayBuffer());
          if(tail[0]===0x54 && tail[1]===0x41 && tail[2]===0x47){ // "TAG"
            const dec = b => new TextDecoder('iso-8859-1').decode(b).replace(/\0+$/,'').trim();
            out.title = dec(tail.slice(3,33)); out.artist = dec(tail.slice(33,63)); out.album = dec(tail.slice(63,93));
          }
        }catch(e){}
      }
      return out;
    }
    function fromFilename(name){
      let base = name.replace(/\.[^.]+$/, '').replace(/^\d{1,3}[\s._-]+/, '').trim();
      const parts = base.split(/\s+[-–—]\s+/);
      if(parts.length >= 2) return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
      return { artist:'Artista desconocido', title: base || 'Sin título' };
    }
    function probeDuration(blob){
      return new Promise(res=>{
        const url = URL.createObjectURL(blob);
        const a = new Audio();

        const to = setTimeout(()=>done(0), 6000);
        a.addEventListener('loadedmetadata', ()=>{ clearTimeout(to); done(a.duration); }, { once:true });
        a.addEventListener('error', ()=>{ clearTimeout(to); done(0); }, { once:true });
        a.src = url;
      });
    }
    /* Color promedio de una portada incrustada */
    function extractColors(coverBlob){
      return new Promise(res=>{
        const url = URL.createObjectURL(coverBlob);
        const img = new Image();
        img.onload = () => {
          try{
            const c = document.createElement('canvas'); c.width = 24; c.height = 24;
            const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, 24, 24);
            const d = ctx.getImageData(0, 0, 24, 24).data;
            let r=0,g=0,b=0,n=0, sr=0,sg=0,sb=0,sn=0;
            for(let i=0;i<d.length;i+=4){
              const R=d[i],G=d[i+1],B=d[i+2];
              r+=R; g+=G; b+=B; n++;
              const mx = Math.max(R,G,B), mn = Math.min(R,G,B);
              if(mx-mn > 60 && mx > 60){ sr+=R; sg+=G; sb+=B; sn++; }
            }
            URL.revokeObjectURL(url);
            const avg = [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
            const sat = sn > 8 ? [Math.round(sr/sn), Math.round(sg/sn), Math.round(sb/sn)] : avg;
            res({ c1:'rgb('+sat[0]+','+sat[1]+','+sat[2]+')', c2:'rgb('+avg[0]+','+avg[1]+','+avg[2]+')' });
          }catch(e){ URL.revokeObjectURL(url); res(null); }
        };
        img.onerror = () => { URL.revokeObjectURL(url); res(null); };
        img.src = url;
      });
    }
    function gradientFor(track){
      if(track.c1 && track.c2) return 'linear-gradient(135deg,' + track.c1 + ',' + track.c2 + ')';
      const h = hashStr(track.title + '|' + track.artist);
      const h1 = h % 360, h2 = (h1 + 45 + (h >> 3) % 70) % 360;
      return 'linear-gradient(135deg, hsl(' + h1 + ' 72% 52%), hsl(' + h2 + ' 78% 40%))';
    }

    async function importFiles(fileList){
      const files = Array.from(fileList || []).filter(isAudioFile);

      let added = 0, skipped = 0;
      const existing = new Set(Array.from(state.tracks.values()).map(t => t.fileName + '|' + t.size));
      for(let i = 0; i < files.length; i++){

          '<div class="t">' + esc(rep.album) + '</div><div class="a">' + esc(rep.artist) + ' · ' + ts.length + (ts.length === 1 ? ' canción' : ' canciones') + '</div></div>';

      if(!state.playlists.length && !favs.trackIds.length){ content.innerHTML = emptyHTML('playlists'); }
      else content.innerHTML = html;

    function renderDetail(){

      if(d.type === 'artist'){

        tracks = Array.from(state.tracks.values()).filter(t => (t.album + '|' + t.artist) === d.key);
        repTrack = sortedTracks(tracks)[0];
        title = repTrack ? repTrack.album : 'Álbum'; sub = (repTrack ? repTrack.artist + ' · ' : '') + tracks.length + ' canciones';
      } else if(d.type === 'playlist'){
        const pl = d.key === '__favs' ? favPlaylist() : state.playlists.find(p => p.id === d.key);
        if(!pl){ state.detail = null; return render(); }
        tracks = pl.trackIds.map(getTrack).filter(Boolean);
        title = pl.name; repTrack = tracks[0];
        const total = tracks.reduce((s,t)=> s + (t.duration||0), 0);

      }
      tracks = sortedTracks(tracks.filter(matchesSearch));
      const cover = repTrack ? coverHTML(repTrack) : '<div class="cover" style="background:linear-gradient(135deg,var(--acc),var(--acc2))"><span>' + icon('note') + '</span></div>';
      let actions = '<button class="btn btn-acc" data-act="playDetail">' + icon('play','sm') + 'Reproducir</button>' +
                    '<button class="btn btn-ghost" data-act="shuffleDetail">' + icon('shuffle','sm') + 'Aleatorio</button>';

        '<div class="detail-head">' + cover + '<div><h2>' + esc(title) + '</h2><p>' + esc(sub) + '</p></div></div>' +
        '<div class="detail-actions">' + actions + '</div>' +

    <script>
    /* ================= Motor de reproducción ================= */
    let viewContextIds = [];
    function bindContent(ids){ viewContextIds = ids || []; }

    function trackColors(t){
      if(t.c1 && t.c2) return [t.c1, t.c2];
      const h = hashStr(t.title + '|' + t.artist);
      const h1 = h % 360, h2 = (h1 + 45 + (h >> 3) % 70) % 360;
      return ['hsl(' + h1 + ' 72% 52%)', 'hsl(' + h2 + ' 78% 38%)'];
    }
    function playContext(ids, startId, opts){
      opts = opts || {};
      state.baseQueue = ids.slice();
      state.contextLabel = opts.label || '';
      const play = playable(ids);
      const useShuffle = opts.shuffle !== undefined ? opts.shuffle : state.shuffle;
      let queue;
      if(startId && isDisliked(getTrack(startId))){
        queue = [startId].concat(play.filter(id => id !== startId));
      } else if(useShuffle && play.length){
        const start = startId && play.includes(startId) ? startId : play[0];
        queue = [start].concat(shuffleArr(play.filter(id => id !== start)));
      } else {
        queue = play.slice();
      }
      if(!queue.length){ toast('No hay canciones para reproducir.'); return; }
      state.queue = queue;
      let idx = startId ? queue.indexOf(startId) : 0;
      if(idx < 0) idx = 0;
      state.qIndex = idx;
      loadTrack(queue[idx], true);
    }
    async function loadTrack(id, autoplay, seekTo){
      const t = getTrack(id);
      if(!t) return;
      state.currentId = id;
      if(audioUrl){ URL.revokeObjectURL(audioUrl); audioUrl = null; }
      const blob = await dbGet('files', id);
      if(!blob){ toast('No se encontró el archivo de esta canción.'); return; }
      audioUrl = URL.createObjectURL(blob);
      audio.src = audioUrl;
      audio.volume = state.volume;
      const doSeek = () => { if(seekTo) { try{ audio.currentTime = seekTo; }catch(e){} } };
      if(seekTo) audio.addEventListener('loadedmetadata', doSeek, { once:true });
      syncPlayerUI();
      render();
      if(autoplay){ try{ await audio.play(); }catch(e){} }
      saveSettings();
    }
    function currentTrack(){ return state.currentId ? getTrack(state.currentId) : null; }
    function findNextIdx(from, dir){
      const n = state.queue.length;
      for(let step = 1; step <= n; step++){
        const i = (((from + dir * step) % n) + n) % n;
        if(i === from) break;
        const t = getTrack(state.queue[i]);
        if(t && !isDisliked(t)) return i;
      }
      return -1;
    }
    function next(auto){
      if(!state.queue.length) return;
      if(auto && state.repeat === 2){ audio.currentTime = 0; audio.play(); return; }
      let idx = findNextIdx(state.qIndex, 1);
      if(idx === -1 || idx <= state.qIndex){
        if(state.repeat === 1 && state.queue.length){
          idx = findNextIdx(-1, 1);
          if(idx === -1){ stopPlayback(); return; }
        } else if(auto){ stopPlayback(); return; }
        else if(idx === -1){ return; }
      }
      state.qIndex = idx;
      loadTrack(state.queue[idx], true);
    }
    function prev(){
      if(!state.queue.length) return;
      if(audio.currentTime > 3){ audio.currentTime = 0; return; }
      let idx = findNextIdx(state.qIndex, -1);
      if(idx === -1){
        if(state.repeat === 1) idx = findNextIdx(state.queue.length, -1);
        if(idx === -1){ audio.currentTime = 0; return; }
      }
      state.qIndex = idx;
      loadTrack(state.queue[idx], true);
    }
    function stopPlayback(){
      audio.pause();
      try{ audio.currentTime = 0; }catch(e){}
      syncPlayerUI();
    }
    function togglePlay(){
      if(!state.currentId){
        const all = sortedTracks(Array.from(state.tracks.values()));
        if(all.length) playContext(all.map(t => t.id), playable(all.map(t=>t.id))[0]);
        return;
      }
      if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
    }
    function playNext(id){
      const t = getTrack(id); if(!t) return;
      if(!state.currentId){ playContext([id], id); toast('Reproduciendo ahora'); return; }
      state.queue = state.queue.filter(x => x !== id);
      if(state.qIndex >= state.queue.length) state.qIndex = state.queue.length - 1;
      const curPos = state.queue.indexOf(state.currentId);
      state.queue.splice(curPos + 1, 0, id);
      state.qIndex = state.queue.indexOf(state.currentId);
      if(!state.baseQueue.includes(id)) state.baseQueue.push(id);
      toast('«' + t.title + '» sonará después de esta');
      renderQueue();
    }
    function addToQueue(id){
      const t = getTrack(id); if(!t) return;
      if(!state.currentId){ playContext([id], id); return; }
      if(!state.queue.includes(id)) state.queue.push(id);
      if(!state.baseQueue.includes(id)) state.baseQueue.push(id);
      toast('«' + t.title + '» se agregó a la cola');
      renderQueue();
    }
    function jumpToQueueIndex(i){
      if(i < 0 || i >= state.queue.length) return;
      state.qIndex = i;
      loadTrack(state.queue[i], true);
    }
    function removeFromQueue(id){
      const i = state.queue.indexOf(id);
      if(i === -1 || id === state.currentId) return;
      state.queue.splice(i, 1);
      if(i < state.qIndex) state.qIndex--;
      renderQueue();
    }
    function setShuffle(on){
      state.shuffle = on;
      if(state.currentId && state.baseQueue.length){
        const cur = state.currentId;
        const play = playable(state.baseQueue).filter(id => id !== cur);
        if(on) state.queue = [cur].concat(shuffleArr(play));
        else state.queue = [cur].concat(playable(state.baseQueue).filter(id => id !== cur));
        // Al apagar el aleatorio, restaurar el orden original desde la actual
        if(!on){
          const all = playable(state.baseQueue);
          const pos = all.indexOf(cur);
          state.queue = pos >= 0 ? all : [cur].concat(play);
        }
        state.qIndex = state.queue.indexOf(cur);
      }
      syncPlayerUI(); renderQueue();
    }
    async function setRating(id, rating){
      const t = getTrack(id); if(!t) return;
      t.rating = (t.rating === rating) ? null : rating;
      await saveTrackMeta(t);
      if(t.rating === 'dislike'){
        toast('«' + t.title + '» quedó fuera de la rotación');
        if(id === state.currentId && !audio.paused){
          const idx = findNextIdx(state.qIndex, 1);
          if(idx > state.qIndex){ state.qIndex = idx; loadTrack(state.queue[idx], true); }
          else { audio.pause(); }
        }
      } else if(t.rating === 'like'){ toast('«' + t.title + '» se queda en la rotación ❤'); }
      syncPlayerUI(); render();
    }

    /* ================= Temporizador ================= */
    function setTimer(mode){
      state.timerMode = mode;
      if(state.timerId){ clearTimeout(state.timerId); state.timerId = null; }
      if(state.timerTick){ clearInterval(state.timerTick); state.timerTick = null; }
      $('#timerLeft').textContent = '';
      $$('#timerChips button').forEach(b => b.classList.toggle('on', String(mode) === b.dataset.timer || (mode === 0 && b.dataset.timer === '0')));
      if(typeof mode === 'number' && mode > 0){
        state.timerEndsAt = Date.now() + mode * 60000;
        state.timerId = setTimeout(()=>{
          audio.pause(); setTimer(0);
          toast('Temporizador: la música se detuvo. Buenas noches.');
        }, mode * 60000);
        const tick = () => {
          const left = Math.max(0, state.timerEndsAt - Date.now());
          $('#timerLeft').textContent = 'quedan ' + fmt(Math.ceil(left/1000));
        };
        tick(); state.timerTick = setInterval(tick, 1000);
        toast('La música se detendrá en ' + mode + ' minutos');
      } else if(mode === 'song'){
        toast('La música se detendrá al terminar esta canción');
      }
    }

    /* ================= Sincronizar interfaces ================= */
    function setBigCover(el, t){
      const url = state.coverUrls.get(t.id);
      el.style.background = gradientFor(t);
      el.innerHTML = url ? '<img src="' + url + '" alt="" />' : '<span>' + esc((t.title||'?').trim().charAt(0).toUpperCase() || '♪') + '</span>';
    }
    function syncPlayerUI(){
      const t = currentTrack();
      const playing = !audio.paused && !!t;
      $('#mini').classList.toggle('show', !!t);
      document.title = t ? (playing ? '▶ ' : '') + t.title + ' · ' + t.artist : 'Nuevo Reproductor de Música';
      if(!t) return;
      // Mini
      setBigCover($('#miniCover'), t);
      $('#miniTitle').textContent = t.title;
      $('#miniArtist').textContent = t.artist;
      $('#miniPlay').innerHTML = icon(playing ? 'pause' : 'play');
      // Sonando ahora
      const np = $('#np');
      np.classList.toggle('playing', playing);
      const [c1, c2] = trackColors(t);
      $('#npBg').style.background = 'linear-gradient(165deg, ' + c1 + ' 0%, ' + c2 + ' 88%)';
      setBigCover($('#npCover'), t);
      $('#npTitle').textContent = t.title;
      $('#npArtist').textContent = t.artist + (t.album && t.album !== 'Álbum desconocido' ? ' · ' + t.album : '');
      $('#npLike').classList.toggle('like-on', t.rating === 'like');
      $('#npDislike').classList.toggle('dislike-on', t.rating === 'dislike');
      $('#btnPlay').innerHTML = icon(playing ? 'pause' : 'play');
      $('#btnShuffle').classList.toggle('on', state.shuffle);
      const rep = $('#btnRepeat');
      rep.classList.toggle('on', state.repeat !== 0);
      rep.classList.toggle('rep-one', state.repeat === 2);
      // Escenario
      const st = $('#stage');
      st.classList.toggle('playing', playing);
      $('#stageBg').style.background = 'radial-gradient(circle at 28% 30%, ' + c1 + ', transparent 62%), radial-gradient(circle at 74% 76%, ' + c2 + ', transparent 60%), #0a0708';
      setBigCover($('#stageCover'), t);
      $('#stageTitle').textContent = t.title;
      $('#stageArtist').textContent = t.artist;
      $('#stagePlay').innerHTML = icon(playing ? 'pause' : 'play');
      // Media Session
      if('mediaSession' in navigator){
        try{
          navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || '' });
          navigator.mediaSession.setActionHandler('play', ()=> audio.play());
          navigator.mediaSession.setActionHandler('pause', ()=> audio.pause());
          navigator.mediaSession.setActionHandler('previoustrack', ()=> prev());
          navigator.mediaSession.setActionHandler('nexttrack', ()=> next(false));
        }catch(e){}
      }
      renderQueue();
    }
    function renderQueue(){
      const box = $('#queueList');
      if(!box) return;
      const upcoming = state.queue.slice(state.qIndex + 1).filter(id => { const t = getTrack(id); return t && !isDisliked(t); });
      if(!upcoming.length){ box.innerHTML = '<div class="q-empty">Nada en la fila. Usa el menú ⋯ de una canción para ponerla «después» o agregarla a la cola.</div>'; return; }
      box.innerHTML = upcoming.map(id => {
        const t = getTrack(id);
        return '<div class="q-row" data-qjump="' + id + '">' + coverHTML(t) +
          '<div class="meta"><div class="t">' + esc(t.title) + '</div><div class="a">' + esc(t.artist) + '</div></div>' +
          '<button class="x" data-qremove="' + id + '" aria-label="Quitar de la cola">' + icon('x','sm') + '</button></div>';
      }).join('');
    }
    function syncProgress(){
      const d = audio.duration || 0, c = audio.currentTime || 0;
      const pct = d ? (c / d) * 100 : 0;
      $('#miniProg').style.width = pct + '%';
      if(!seeking) $('#seekRange').value = d ? Math.round(c / d * 1000) : 0;
      $('#tCur').textContent = fmt(c); $('#tDur').textContent = fmt(d);
      $('#stageProg').style.width = pct + '%';
      $('#stageCur').textContent = fmt(c); $('#stageDur').textContent = fmt(d);
    }

    /* ================= Eventos del reproductor ================= */
    let seeking = false;
    audio.addEventListener('play', syncPlayerUI);
    audio.addEventListener('pause', ()=>{ syncPlayerUI(); saveSettings(); });
    audio.addEventListener('timeupdate', ()=>{
      syncProgress();
      if(Math.floor(audio.currentTime) % 5 === 0) saveSettings();
    });
    audio.addEventListener('loadedmetadata', syncProgress);
    audio.addEventListener('ended', ()=>{
      if(state.timerMode === 'song'){ setTimer(0); audio.pause(); toast('Temporizador: fin de la canción.'); return; }
      next(true);
    });
    $('#seekRange').addEventListener('input', ()=>{ seeking = true; });
    $('#seekRange').addEventListener('change', e => {
      seeking = false;
      if(audio.duration) audio.currentTime = (Number(e.target.value) / 1000) * audio.duration;
    });
    $('#volRange').addEventListener('input', e => {
      state.volume = Number(e.target.value) / 100;
      audio.volume = state.volume;
      saveSettings();
    });
    $('#btnPlay').addEventListener('click', togglePlay);
    $('#miniPlay').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
    $('#stagePlay').addEventListener('click', togglePlay);
    $('#btnNext').addEventListener('click', ()=> next(false));
    $('#miniNext').addEventListener('click', e => { e.stopPropagation(); next(false); });
    $('#stageNext').addEventListener('click', ()=> next(false));
    $('#btnPrev').addEventListener('click', prev);
    $('#miniPrev').addEventListener('click', e => { e.stopPropagation(); prev(); });
    $('#stagePrev').addEventListener('click', prev);
    $('#btnShuffle').addEventListener('click', ()=> setShuffle(!state.shuffle));
    $('#btnRepeat').addEventListener('click', ()=>{
      state.repeat = (state.repeat + 1) % 3;
      toast(state.repeat === 0 ? 'Repetir: apagado' : state.repeat === 1 ? 'Repetir: todo' : 'Repetir: esta canción');
      syncPlayerUI();
    });
    $('#npLike').addEventListener('click', ()=>{ if(state.currentId) setRating(state.currentId, 'like'); });
    $('#npDislike').addEventListener('click', ()=>{ if(state.currentId) setRating(state.currentId, 'dislike'); });
    $('#mini').addEventListener('click', ()=>{ if(state.currentId) $('#np').classList.add('open'); });
    $('#npClose').addEventListener('click', ()=> $('#np').classList.remove('open'));
    $('#btnQueueToggle').addEventListener('click', ()=>{
      const b = $('#queueBox'); b.classList.toggle('show'); renderQueue();
    });
    $('#btnTimer').addEventListener('click', ()=>{
      const b = $('#timerBox'); b.classList.toggle('show');
      $('#btnTimer').classList.toggle('on', b.classList.contains('show'));
    });
    $$('#timerChips button').forEach(b => b.addEventListener('click', ()=>{
      const v = b.dataset.timer;
      setTimer(v === 'song' ? 'song' : Number(v));
    }));
    $('#queueList').addEventListener('click', e => {
      const rm = e.target.closest('[data-qremove]');
      if(rm){ e.stopPropagation(); removeFromQueue(rm.dataset.qremove); return; }
      const jump = e.target.closest('[data-qjump]');
      if(jump) jumpToQueueIndex(state.queue.indexOf(jump.dataset.qjump));
    });

    /* ================= Modo Escenario ================= */
    function openStage(){
      if(!state.currentId){ toast('Primero elige una canción.'); return; }
      $('#stage').classList.add('open');
      syncPlayerUI();
      try{ const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
    }
    function closeStage(){
      $('#stage').classList.remove('open');
      try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
    }
    $('#npStage').addEventListener('click', openStage);
    $('#btnStage2').addEventListener('click', openStage);
    $('#stageClose').addEventListener('click', closeStage);
    document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement) $('#stage').classList.remove('open'); });
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape'){
        if($('#stage').classList.contains('open')) closeStage();
        else if($('#np').classList.contains('open')) $('#np').classList.remove('open');
        closeSheet();
      }
    });
</script>

    <script>
    /* ================= Hojas y modales ================= */
    const sheet = $('#sheet'), scrim = $('#scrim');

      sheet.innerHTML = '<div class="grab"></div>' + html;

    function closeSheet(){ sheet.classList.remove('show'); scrim.classList.remove('show'); }
    scrim.addEventListener('click', closeSheet);

      $('#modalBox').innerHTML = html;
      $('#modal').classList.add('show');
    }
    function closeModal(){ $('#modal').classList.remove('show'); }
    $('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
    function textModal(title, label, initial, okLabel, onOk){
      openModal('<h3>' + esc(title) + '</h3><p>' + esc(label) + '</p>' +
        '<input type="text" id="modalInput" value="' + esc(initial || '') + '" maxlength="80" />' +
        '<div class="row-btns"><button class="btn btn-ghost" id="modalCancel">Cancelar</button>' +
        '<button class="btn btn-acc" id="modalOk">' + esc(okLabel) + '</button></div>');
      const inp = $('#modalInput'); inp.focus(); inp.select();
      $('#modalCancel').addEventListener('click', closeModal);
      const submit = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } closeModal(); onOk(v); };
      $('#modalOk').addEventListener('click', submit);
      inp.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    }
    function confirmModal(title, text, okLabel, onOk){
      openModal('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
        '<div class="row-btns"><button class="btn btn-ghost" id="modalCancel">Cancelar</button>' +
        '<button class="btn btn-danger" id="modalOk">' + esc(okLabel) + '</button></div>');
      $('#modalCancel').addEventListener('click', closeModal);
      $('#modalOk').addEventListener('click', ()=>{ closeModal(); onOk(); });
    }

    /* ================= Menú de canción ================= */
    function songMenu(id){
      const t = getTrack(id); if(!t) return;
      const inPlaylist = state.detail && state.detail.type === 'playlist' && state.detail.key !== '__favs';
      openSheet(
        '<h3>' + esc(t.title) + '</h3><p class="sub">' + esc(t.artist) + (t.album && t.album !== 'Álbum desconocido' ? ' · ' + esc(t.album) : '') + '</p>' +
        '<button class="sheet-item" data-m="play">' + icon('play') + 'Reproducir ahora</button>' +
        '<button class="sheet-item" data-m="next">' + icon('playNext') + 'Reproducir después</button>' +
        '<button class="sheet-item" data-m="queue">' + icon('addQ') + 'Agregar a la cola</button>' +
        '<button class="sheet-item" data-m="playlist">' + icon('addPl') + 'Agregar a una playlist</button>' +
        '<button class="sheet-item" data-m="like">' + icon(t.rating === 'like' ? 'check' : 'heart') + (t.rating === 'like' ? 'Quitar el «Me gusta»' : 'Me gusta · se queda en la rotación') + '</button>' +
        '<button class="sheet-item" data-m="dislike">' + icon('heartSlash') + (t.rating === 'dislike' ? 'Quitar el «No me gusta»' : 'No me gusta · fuera de la rotación') + '</button>' +
        (inPlaylist ? '<button class="sheet-item" data-m="removePl">' + icon('x') + 'Quitar de esta playlist</button>' : '') +
        '<button class="sheet-item danger" data-m="delete">' + icon('trash') + 'Eliminar de la biblioteca</button>'
      );
      sheet.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', ()=>{
        const act = b.dataset.m;
        closeSheet();
        if(act === 'play'){
          const ctx = viewContextIds.length ? viewContextIds : Array.from(state.tracks.keys());
          playContext(ctx, id, { label:'' });
        }
        else if(act === 'next') playNext(id);
        else if(act === 'queue') addToQueue(id);
        else if(act === 'playlist') playlistPicker(id);
        else if(act === 'like') setRating(id, 'like');
        else if(act === 'dislike') setRating(id, 'dislike');
        else if(act === 'removePl') removeFromPlaylist(state.detail.key, id);
        else if(act === 'delete') deleteTrack(id);
      }));
    }
    function playlistPicker(songId){
      const items = state.playlists.map(pl =>
        '<button class="sheet-item" data-pl="' + pl.id + '">' + icon('note') + esc(pl.name) + '</button>').join('');
      openSheet('<h3>Agregar a una playlist</h3><p class="sub">Elige dónde guardar esta canción.</p>' +
        items +
        '<button class="sheet-item" data-pl="__new">' + icon('plus') + 'Nueva playlist</button>');
      sheet.querySelectorAll('[data-pl]').forEach(b => b.addEventListener('click', ()=>{
        const pid = b.dataset.pl;
        closeSheet();
        if(pid === '__new'){
          textModal('Nueva playlist', 'Ponle un nombre y esta canción será la primera.', '', 'Crear y agregar', async name => {
            const pl = { id: uid(), name, trackIds: [songId], createdAt: Date.now() };
            await savePlaylist(pl);
            toast('«' + name + '» creada con tu canción dentro');
            render();
          });
        } else {
          addToPlaylist(pid, songId);
        }
      }));
    }
    async function addToPlaylist(pid, songId){
      const pl = state.playlists.find(p => p.id === pid); if(!pl) return;
      if(pl.trackIds.includes(songId)){ toast('Esa canción ya está en «' + pl.name + '»'); return; }
      pl.trackIds.push(songId);
      await savePlaylist(pl);
      toast('Agregada a «' + pl.name + '»');
      render();
    }
    async function removeFromPlaylist(pid, songId){
      const pl = state.playlists.find(p => p.id === pid); if(!pl) return;
      pl.trackIds = pl.trackIds.filter(x => x !== songId);
      await savePlaylist(pl);
      toast('Quitada de «' + pl.name + '»');
      render();
    }
    function createPlaylist(){
      textModal('Nueva playlist', 'Ponle un nombre: el plan, el momento, la persona…', '', 'Crear', async name => {
        const pl = { id: uid(), name, trackIds: [], createdAt: Date.now() };
        await savePlaylist(pl);
        toast('Playlist «' + name + '» creada');
        state.view = 'playlists'; state.detail = { type:'playlist', key: pl.id };
        render();
      });
    }
    function deleteTrack(id){
      const t = getTrack(id); if(!t) return;
      confirmModal('¿Eliminar esta canción?', '«' + t.title + '» se borrará de la biblioteca y de tus playlists en este dispositivo. El archivo original, fuera de la app, no se toca.', 'Eliminar', async () => {
        await dbDel('tracks', id); await dbDel('files', id); await dbDel('covers', id);
        state.tracks.delete(id);
        if(state.coverUrls.has(id)){ URL.revokeObjectURL(state.coverUrls.get(id)); state.coverUrls.delete(id); }
        for(const pl of state.playlists){
          if(pl.trackIds.includes(id)){ pl.trackIds = pl.trackIds.filter(x => x !== id); await savePlaylist(pl); }
        }
        state.queue = state.queue.filter(x => x !== id);
        state.baseQueue = state.baseQueue.filter(x => x !== id);
        if(state.currentId === id){
          audio.pause(); audio.removeAttribute('src'); state.currentId = null; state.qIndex = -1;
          syncPlayerUI();
        } else {
          state.qIndex = state.queue.indexOf(state.currentId);
        }
        toast('Canción eliminada');
        render();
      });
    }

    /* ================= Delegación de clics en el contenido ================= */
    content.addEventListener('click', e => {
      const rate = e.target.closest('[data-rate]');
      if(rate){ e.stopPropagation(); rateCycle(rate.dataset.rate); return; }
      const more = e.target.closest('[data-more]');
      if(more){ e.stopPropagation(); songMenu(more.dataset.more); return; }
      const act = e.target.closest('[data-act]');
      if(act){ handleAct(act.dataset.act); return; }
      const artist = e.target.closest('[data-artist]');
      if(artist){ state.detail = { type:'artist', key: artist.dataset.artist }; render(); $('#main').scrollTop = 0; return; }
      const album = e.target.closest('[data-album]');
      if(album){ state.detail = { type:'album', key: album.dataset.album }; render(); $('#main').scrollTop = 0; return; }
      const pl = e.target.closest('[data-playlist]');
      if(pl){ state.detail = { type:'playlist', key: pl.dataset.playlist }; render(); $('#main').scrollTop = 0; return; }
      const song = e.target.closest('[data-song]');
      if(song){
        const ctx = viewContextIds.length ? viewContextIds : Array.from(state.tracks.keys());
        playContext(ctx, song.dataset.song, { label:'' });
      }
    });
    function rateCycle(id){
      const t = getTrack(id); if(!t) return;
      if(!t.rating) setRating(id, 'like');
      else if(t.rating === 'like') setRating(id, 'dislike');
      else setRating(id, 'dislike'); // tercer toque: quita el dislike (setRating alterna)
    }
    function handleAct(act){
      if(act === 'addFiles') $('#fileInput').click();
      else if(act === 'addFolder') $('#folderInput').click();
      else if(act === 'newPlaylist') createPlaylist();
      else if(act === 'back'){ state.detail = null; render(); }
      else if(act === 'playDetail'){
        const ids = viewContextIds.slice();
        const first = playable(ids)[0];
        if(first) playContext(ids, first, { shuffle:false });
        else toast('Aquí solo hay canciones con «No me gusta». Quita el dislike para escucharlas en orden.');
      }
      else if(act === 'shuffleDetail'){
        const ids = viewContextIds.slice();
        const first = playable(ids)[0];
        if(first) playContext(ids, first, { shuffle:true });
        else toast('No hay canciones disponibles para el aleatorio.');
      }
      else if(act === 'renamePlaylist'){
        const pl = state.playlists.find(p => p.id === state.detail.key); if(!pl) return;
        textModal('Renombrar playlist', 'El nuevo nombre de la playlist.', pl.name, 'Guardar', async name => {
          pl.name = name; await savePlaylist(pl); render();
        });
      }
      else if(act === 'deletePlaylist'){
        const pl = state.playlists.find(p => p.id === state.detail.key); if(!pl) return;
        confirmModal('¿Borrar esta playlist?', 'Se borrará «' + pl.name + '». Tus canciones no se tocan, solo la lista.', 'Borrar playlist', async () => {
          state.playlists = state.playlists.filter(p => p.id !== pl.id);
          await dbDel('playlists', pl.id);
          state.detail = null;
          toast('Playlist borrada');
          render();
        });
      }
    }

    /* ================= Controles superiores ================= */
    $$('#tabs .tab').forEach(b => b.addEventListener('click', ()=>{
      state.view = b.dataset.view; state.detail = null; render();
    }));
    let searchDeb = null;
    $('#searchInput').addEventListener('input', e => {
      clearTimeout(searchDeb);
      searchDeb = setTimeout(()=>{ state.search = e.target.value.trim(); render(); }, 160);
    });
    $('#sortSel').addEventListener('change', e => { state.sort = e.target.value; saveSettings(); render(); });
    $$('#viewSeg button').forEach(b => b.addEventListener('click', ()=>{
      state.viewMode = b.dataset.vm;
      $$('#viewSeg button').forEach(x => x.classList.toggle('on', x === b));
      saveSettings(); render();
    }));
    $('#btnShuffleAll').addEventListener('click', ()=>{
      const ids = Array.from(state.tracks.keys());
      const first = playable(ids)[0];
      if(!first){ toast('Agrega música primero y luego mezclamos todo.'); return; }
      playContext(ids, first, { shuffle:true });
      toast('Todo en aleatorio');
    });
    function addMenu(){
      openSheet('<h3>Agregar música</h3><p class="sub">Los archivos se guardan solo en este dispositivo. Nada se sube a internet.</p>' +
        '<button class="sheet-item" data-a="files">' + icon('file') + 'Elegir archivos</button>' +
        '<button class="sheet-item" data-a="folder">' + icon('folder') + 'Elegir una carpeta completa</button>');
      sheet.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', ()=>{
        closeSheet();
        if(b.dataset.a === 'files') $('#fileInput').click(); else $('#folderInput').click();
      }));
    }
    $('#btnAddTop').addEventListener('click', addMenu);
    $('#fileInput').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
    $('#folderInput').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });

    /* Arrastrar y soltar */
    let dragCount = 0;
    window.addEventListener('dragenter', e => { e.preventDefault(); dragCount++; $('#dropVeil').classList.add('show'); });
    window.addEventListener('dragleave', e => { dragCount--; if(dragCount <= 0){ dragCount = 0; $('#dropVeil').classList.remove('show'); } });
    window.addEventListener('dragover', e => e.preventDefault());
    window.addEventListener('drop', async e => {
      e.preventDefault(); dragCount = 0; $('#dropVeil').classList.remove('show');
      const items = e.dataTransfer.items;
      if(items && items.length && items[0].webkitGetAsEntry){
        const files = [];
        const entries = Array.from(items).map(i => i.webkitGetAsEntry()).filter(Boolean);
        async function walk(entry){
          if(entry.isFile){ await new Promise(r => entry.file(f => { files.push(f); r(); }, () => r())); }
          else if(entry.isDirectory){
            const reader = entry.createReader();
            const kids = await new Promise(r => reader.readEntries(r, () => r([])));
            for(const k of kids) await walk(k);
          }
        }
        for(const en of entries) await walk(en);
        importFiles(files);
      } else {
        importFiles(e.dataTransfer.files);
      }
    });

    /* ================= Arranque ================= */
    (async function init(){
      try{
        await openDB();
        const [tracks, playlists, settings] = await Promise.all([
          dbGetAll('tracks'), dbGetAll('playlists'), dbGet('kv', 'settings')
        ]);
        tracks.forEach(t => state.tracks.set(t.id, t));
        state.playlists = playlists.sort((a,b)=> a.createdAt - b.createdAt);
        if(settings){
          if(typeof settings.volume === 'number') state.volume = settings.volume;
          if(settings.sort){ state.sort = settings.sort; $('#sortSel').value = settings.sort; }
          if(settings.viewMode){
            state.viewMode = settings.viewMode;
            $$('#viewSeg button').forEach(x => x.classList.toggle('on', x.dataset.vm === settings.viewMode));
          }
        }
        audio.volume = state.volume;
        $('#volRange').value = Math.round(state.volume * 100);
        render();
        hydrateCovers();
        // Continuar donde ibas: última canción, en su segundo, en pausa.
        if(settings && settings.lastTrackId && state.tracks.has(settings.lastTrackId)){
          const id = settings.lastTrackId;
          state.queue = [id]; state.baseQueue = [id]; state.qIndex = 0;
          await loadTrack(id, false, settings.lastPosition || 0);
        }
      }catch(err){
        content.innerHTML = '<div class="empty"><div class="art">' + icon('note') + '</div><h2>Algo salió mal al abrir tu biblioteca</h2><p>Tu música sigue guardada en este dispositivo. Cierra y vuelve a abrir la página para intentarlo de nuevo.</p></div>';
      }
    })();
    window.addEventListener('beforeunload', ()=>{ saveSettings(); });
    </script>
  </body>
